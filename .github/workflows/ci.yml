name: CI

# Implements the BLD-1..BLD-6 requirements in this repository's PRD (CI/CD section).
# No secrets are used: the only credential is the job's own GITHUB_TOKEN (read
# access), used to fetch private Go modules. PR CI never talks to a real
# ServiceNow or Okta instance (BLD-4); `snow selftest` is an on-demand job.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Optional ref to check out (default is the triggering ref)
        required: false
        type: string

permissions:
  contents: read
  packages: read

env:
  GOPRIVATE: github.com/stainedhead/*
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate module fetches with the job token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Download modules
        run: go mod download
      - name: go mod tidy leaves no diff
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git status --porcelain -- go.mod go.sum
            git diff -- go.mod go.sum
            echo "::error::go mod tidy changed go.mod or go.sum; run it and commit the result"
            exit 1
          fi
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...
      # FR-051: the generated skill must match the committed golden. `make skill`
      # writes the git-ignored dist/snow-cli.md; any difference fails the build.
      - name: Skill drift check
        run: |
          make skill
          if ! diff -u internal/cli/testdata/skill.golden.md dist/snow-cli.md; then
            echo "::error::generated skill drifted from internal/cli/testdata/skill.golden.md; run 'go test ./internal/cli -run TestSkillGolden -update' and review the change"
            exit 1
          fi
      - name: Remove job token from git config
        if: always()
        run: rm -f "$HOME/.gitconfig"

  # BLD-3: every release target is cross-compiled on each PR. Windows users run the
  # Linux build under WSL, so there is no windows target.
  cross-build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64, runner: macos-14 }
          - { goos: linux, goarch: amd64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, runner: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Authenticate module fetches with the job token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Download modules
        run: go mod download
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # NFR-005: all targets are static builds.
          CGO_ENABLED: '0'
        run: go build ./...
